name: Daily grant tracking
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 測試蒐集與快照讀取，不寫入 grant-data（PR 分支必須勾選）
        type: boolean
        default: false
      initialize:
        description: '首次建立空資料庫（僅限尚無 grant-data 分支）'
        type: boolean
        default: false
  # UTC 00:00 = 台灣 08:00
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read
concurrency:
  group: grant-data-writer
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    outputs:
      base_sha: ${{ steps.restore.outputs.base_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore data branch or explicitly initialize
        id: restore
        env:
          INITIALIZE: ${{ inputs.initialize }}
        run: |
          set -euo pipefail
          mkdir -p var reports
          git ls-remote --heads origin > var/remote-heads
          if awk '$2 == "refs/heads/grant-data" {found=1} END {exit !found}' var/remote-heads; then
            git fetch origin grant-data
            echo "base_sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            git worktree add data-state FETCH_HEAD
            test -s data-state/grants.sqlite3
            cp data-state/grants.sqlite3 var/grants.sqlite3
            cp data-state/grants.sqlite3 var/baseline.sqlite3
          else
            test "$INITIALIZE" = true || { echo 'Missing grant-data; explicitly initialize on first run'; exit 1; }
            git worktree add --detach data-state
            cd data-state
            git checkout --orphan grant-data
            git rm -rf .
            git clean -fdx
          fi
      - name: Collect, classify and export
        env:
          INITIALIZE: ${{ inputs.initialize }}
        run: |
          args=()
          if [ "$INITIALIZE" = true ]; then args+=(--initialize); fi
          python -m grant_watch.daily --output reports "${args[@]}"
      - name: Validate complete snapshot and preserve historical IDs
        run: |
          args=()
          if [ -f var/baseline.sqlite3 ]; then args+=(--baseline var/baseline.sqlite3); fi
          python -m grant_watch.snapshot --db var/grants.sqlite3 --report reports/report.json --announcements reports/announcements.json "${args[@]}"
      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: grant-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/grants.sqlite3
            reports/report.json
            reports/announcements.json
          retention-days: 7
          if-no-files-found: error
      - name: Show report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports
          if [ ! -f reports/report.json ]; then
            python - <<'PYREPORT'
          import json, os
          from pathlib import Path
          Path('reports/report.json').write_text(json.dumps(dict(
              status=os.environ['JOB_STATUS'], error='Setup or restore failed before collection; inspect failed step logs',
              inserted=0, updated=0, failed_sources=[], run_id=os.environ['GITHUB_RUN_ID'])))
          PYREPORT
            echo 'Collection did not start. See the failed setup/restore step for the error reason and timing.' > reports/summary.md
          fi
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'Dry runs do not publish. Database is saved only if the publish job succeeds.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grant-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/announcements.json
            reports/report.json
            reports/summary.md
            reports/*.xlsx
          retention-days: 30
          if-no-files-found: warn
  publish:
    needs: collect
    if: github.ref == 'refs/heads/main' && inputs.dry_run != true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grant-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Persist successful snapshot (no force push)
        env:
          BASE_SHA: ${{ needs.collect.outputs.base_sha }}
          INITIALIZE: ${{ inputs.initialize }}
        run: |
          set -euo pipefail
          git ls-remote --heads origin > remote-heads
          if awk '$2 == "refs/heads/grant-data" {found=1} END {exit !found}' remote-heads; then
            git fetch origin grant-data
            test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA" || { echo 'Data changed after collection; rerun instead of overwriting'; exit 1; }
            git worktree add data-state FETCH_HEAD
          else
            test -z "$BASE_SHA" && test "$INITIALIZE" = true || { echo 'Data branch disappeared; refusing reset'; exit 1; }
            git worktree add --detach data-state
            cd data-state
            git checkout --orphan grant-data
            git rm -rf .
            git clean -fdx
            cd ..
          fi
          cp candidate/var/grants.sqlite3 data-state/grants.sqlite3
          cp candidate/reports/report.json data-state/latest-report.json
          cp candidate/reports/announcements.json data-state/announcements.json
          cd data-state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grants.sqlite3 latest-report.json announcements.json
          if ! git diff --cached --quiet; then git commit -m "Daily snapshot $GITHUB_RUN_ID"; fi
          git push origin HEAD:refs/heads/grant-data
          echo 'Snapshot successfully pushed to grant-data.' >> "$GITHUB_STEP_SUMMARY"
